name: Sync FnDepot Index

on:
  schedule:
    - cron: '3 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fndepot
  cancel-in-progress: false

env:
  # 上游项目
  UPSTREAM_OWNER: 'guan-ry'
  UPSTREAM_REPO: 'FanControlServerApp'
  # 主应用版本（manifest 中的 version，Auto-increment 步骤会更新此行）
  APP_VERSION: '1.3.7.9'
  # 主应用 FPK 资产名（与 fnpack.json 中 download_url 保持一致）
  APP_ASSET: 'FanControlServer-v1.3.7.9-qnapfancontrol-iframe.fpk'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Install fnpack
        run: |
          curl -L -o fnpack "https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64"
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: Auto-increment version from upstream
        run: |
          # 读取 manifest 当前版本（manifest 为 CRLF，需去除 \r 防算术报错）
          CURRENT=$(grep '^version' manifest | sed 's/version.*= *//; s/^ *//; s/ *$//' | tr -d '\r')
          echo "Current manifest version: $CURRENT"

          # 获取上游最新 Release tag（用 jq 解析，避免 grep+sed 在单行 JSON 下误解析）
          TAG=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "User-Agent: FanControlServer" \
            "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/releases/latest" \
            | jq -r .tag_name)
          echo "Upstream latest tag: $TAG"

          # 解析上游版本号（去v/V前缀，去-beta等后缀，只取x.y.z.w）
          RAW=$(echo "$TAG" | sed 's/^[vV]//; s/[-+].*//')
          echo "Raw upstream version: $RAW"

          # 拆成段，只取前三段
          IFS='.' read -ra U_PARTS <<< "$RAW"
          U1=${U_PARTS[0]:-0}
          U2=${U_PARTS[1]:-0}
          U3=${U_PARTS[2]:-0}
          U4=${U_PARTS[3]:-0}

          # 拆当前版本
          IFS='.' read -ra C_PARTS <<< "$CURRENT"
          C1=${C_PARTS[0]:-0}
          C2=${C_PARTS[1]:-0}
          C3=${C_PARTS[2]:-0}
          C4=${C_PARTS[3]:-0}

          echo "Upstream: $U1.$U2.$U3.$U4"
          echo "Current:  $C1.$C2.$C3.$C4"

          # 大版本跟随：只跟 upstream 的 1.2.3 段
          # 尾段递增：当前尾段 +1
          NEW1=$U1
          NEW2=$U2
          NEW3=$U3
          NEW4=$(( C4 + 1 ))
          NEW_VERSION="${NEW1}.${NEW2}.${NEW3}.${NEW4}"

          echo "New version: $NEW_VERSION"

          # 写回 manifest
          sed -i "s/^version.*= .*/version               = $NEW_VERSION/" manifest

          # 更新 sync.yml APP_VERSION 和 APP_ASSET
          sed -i "s/^  APP_VERSION: .*/  APP_VERSION: '$NEW_VERSION'/" .github/workflows/sync.yml

          OLD_ASSET="FanControlServer-v${CURRENT}-qnapfancontrol-iframe.fpk"
          NEW_ASSET="FanControlServer-v${NEW_VERSION}-qnapfancontrol-iframe.fpk"
          sed -i "s|$OLD_ASSET|$NEW_ASSET|g" .github/workflows/sync.yml

          # 同时更新 manifest 中的 env 中的版本引用（仅 sync.yml）
          echo "Manifest and sync.yml updated to $NEW_VERSION (from upstream $RAW)"

          # 注入本次构建使用的版本环境变量
          echo "APP_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "APP_ASSET=${NEW_ASSET}" >> "$GITHUB_ENV"

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Verify frontend output
        run: |
          if [[ ! -f "backend/web/index.html" ]]; then
            echo "错误: 未找到 backend/web/index.html"
            exit 1
          fi

      - name: Build Backend (linux/amd64)
        run: |
          mkdir -p app/server
          cd backend
          go mod tidy
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X fancontrolserver/internal/version.Version=${APP_VERSION}" \
            -o ../app/server/fancontrolserver .

      - name: Build FanControlServer FPK (with built-in driver)
        run: |
          fnpack build
          mkdir -p dist
          mv *.fpk "dist/${APP_ASSET}"
          ls -lh dist/

      - name: Upload FPK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "QNAP Fan Control $TAG" \
              --notes "QNAP Fan Control $TAG - 从源码构建，IT8528 驱动已内置，安装即用。"
          fi
          gh release upload "$TAG" "dist/${APP_ASSET}" --clobber

      - name: Generate fnpack.json from local builds
        run: python scripts/gen_fnpack.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.com"
          # 注意：不提交 workflow 文件本身，避免 GITHUB_TOKEN 缺少 workflows 权限导致 push 被拒
          git add manifest fnpack.json
          git commit -m "ci: auto-increment version $NEW_VERSION (upstream $(echo $TAG | sed 's/^[vV]//; s/[-+].*//'))" || echo "no changes to commit"
          git push
