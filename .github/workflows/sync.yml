name: Sync FnDepot Index

on:
  schedule:
    - cron: '3 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fndepot
  cancel-in-progress: false

env:
  # 主应用版本（manifest 中的 version）
  APP_VERSION: '1.3.7.7'
  # 主应用 FPK 资产名（与 fnpack.json 中 download_url 保持一致）
  APP_ASSET: 'FanControlServer-v1.3.7.7-qnapfancontrol-iframe.fpk'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Install fnpack
        run: |
          curl -L -o fnpack "https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64"
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Verify frontend output
        run: |
          if [[ ! -f "backend/web/index.html" ]]; then
            echo "错误: 未找到 backend/web/index.html"
            exit 1
          fi

      - name: Build Backend (linux/amd64)
        run: |
          mkdir -p app/server
          cd backend
          go mod tidy
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X fancontrolserver/internal/version.Version=${APP_VERSION}" \
            -o ../app/server/fancontrolserver .

      - name: Build FanControlServer FPK (with built-in driver)
        run: |
          fnpack build
          mkdir -p dist
          mv *.fpk "dist/${APP_ASSET}"
          ls -lh dist/

      - name: Upload FPK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "QNAP Fan Control $TAG" \
              --notes "QNAP Fan Control $TAG — 从源码构建，IT8528 驱动已内置，安装即用。"
          fi
          gh release upload "$TAG" "dist/${APP_ASSET}" --clobber

      - name: Generate fnpack.json from local builds
        run: python scripts/gen_fnpack.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- fnpack.json; then
            echo "fnpack.json unchanged, skipping commit"
          else
            git add fnpack.json
            git commit -m "ci: auto-sync fnpack.json (source build)"
            git push
          fi
